# NGINX site settings for Laravel.
# Save as docker/nginx.conf in your project. The Dockerfile copies it into the image.
# __PORT__ is replaced by the start script with the port Render gives the app.

server {
    listen __PORT__;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20M;

    # Send every request that is not a real file to Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hand PHP files to PHP-FPM, which listens on port 9000 inside the container
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Never serve hidden files such as .env
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
